<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>The Last Element · look-dev</title>
<link rel="stylesheet" href="/node_modules/@fontsource/noto-serif-sc/500.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-serif-sc/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-sc/700.css">

<link rel="stylesheet" href="/node_modules/@fontsource/geist-mono/500.css">

<style>
  :root {
    --ink: #0B0A09; --plate: #121110; --paper: #EEE8DE; --paper2: #CFC7BA;
    --dim: #A39C92; --mute: #6E685F; --hair: rgba(238,232,222,.18);
    --violet: #5B2EFF; --violet-t: #8C72FF;
  }
  html, body { margin: 0; background: var(--ink); }
  #stage { position: relative; width: 1080px; overflow: hidden; background: var(--ink); }
  canvas { position: absolute; left: 0; top: 0; }
  .t { position: absolute; white-space: nowrap; color: var(--paper); font-kerning: normal; }
  .serif { font-family: 'Noto Serif SC', serif; }
  .sans { font-family: 'Noto Sans SC', sans-serif; }
  .kai { font-family: 'LXGW WenKai', serif; }
  .mono { font-family: 'Geist Mono', monospace; font-variant-numeric: tabular-nums; }
  .lat { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.12em; letter-spacing: 0; }
  .latsans { font-family: 'Inter Tight', sans-serif; font-weight: 500; letter-spacing: 0.02em; }
  .halt { font-feature-settings: "halt" 1; }
  .rule { position: absolute; height: 2px; background: var(--dim); }
  .dot { position: absolute; border-radius: 50%; background: var(--violet); }
</style>

<body>
<div id="stage"><canvas id="cv"></canvas></div>
<script>
const TAU = Math.PI * 2;
const W = 1080;
const q = new URLSearchParams(location.search);
const FRAME = q.get('f') || 'f01';
const H = FRAME.startsWith('c') ? 1440 : 1920;
const stage = document.getElementById('stage');
stage.style.height = H + 'px';
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingQuality = 'high';

const IMG = {};
function load(name) {
  return new Promise((res) => { const i = new Image(); i.onload = () => { IMG[name] = i; res(i); }; i.src = 'img/' + name; });
}

// ------------------------------------------------------------------ text, placed by BASELINE
const probeCache = {};
function baselineOffset(cls, size, lh, weight) {
  const key = [cls, size, lh, weight].join('|');
  if (probeCache[key] != null) return probeCache[key];
  const d = document.createElement('div');
  d.className = 't ' + cls; d.style.fontSize = size + 'px'; d.style.lineHeight = lh + 'px'; d.style.fontWeight = weight;
  d.style.left = '0px'; d.style.top = '0px'; d.style.visibility = 'hidden';
  d.innerHTML = '国<span style="display:inline-block;width:0;height:0;vertical-align:baseline"></span>';
  stage.appendChild(d);
  const off = d.lastChild.offsetTop;
  stage.removeChild(d);
  return (probeCache[key] = off);
}
// T(html, x, baseline, {cls,size,lh,weight,color,track,align})
function T(html, x, base, o = {}) {
  const cls = o.cls || 'serif', size = o.size || 60, lh = o.lh || Math.round(size * 1.4), weight = o.weight || 500;
  const d = document.createElement('div');
  d.className = 't ' + cls;
  Object.assign(d.style, { fontSize: size + 'px', lineHeight: lh + 'px', fontWeight: weight, color: o.color || 'var(--paper)',
    letterSpacing: (o.track ?? 0.02) + 'em' });
  d.innerHTML = html;
  stage.appendChild(d);
  const top = base - baselineOffset(cls, size, lh, weight);
  d.style.top = top + 'px';
  if (o.align === 'right') { d.style.left = (x - d.offsetWidth + size * (o.track ?? 0.02)) + 'px'; }
  else if (o.align === 'center') { d.style.left = (x - d.offsetWidth / 2) + 'px'; }
  else d.style.left = (x + (o.optical || 0)) + 'px';
  return d;
}
const lat = (s) => `<span class="lat">${s}</span>`;
// kicker with a 28 x 2 rule before it
function K(text, base, o = {}) {
  const size = o.size || 32;
  if (o.violet) {            // our voice: the brand's violet dot, then violet text
    dotAt(96 + 5, base - size * 0.36, 10);
    return T(text, 96 + 24, base, { cls: 'sans', size, weight: 500, track: 0.1, color: 'var(--violet-t)', lh: 40 });
  }
  return T(text, 96, base, { cls: 'sans', size, weight: 500, track: 0.1, color: 'var(--dim)', lh: 40 });   // his voice: no marker
}
// film micro line (chapter label left, live readout right)
function micro(idx, cjk, latin, readout, base = 236) {
  T(idx, 96, base, { cls: 'mono', size: 22, weight: 500, track: 0.02, color: '#8A847B', lh: 28 });
  const c = T(cjk, 134, base, { cls: 'sans', size: 26, weight: 500, track: 0.06, color: 'var(--paper2)', lh: 32 });
  T(latin, 134 + c.offsetWidth + 14, base, { cls: 'mono', size: 16, weight: 400, track: 0.22, color: 'var(--mute)', lh: 20 });
  if (readout) T(readout, 984, base, { cls: 'mono', size: 24, weight: 400, track: 0.02, color: 'var(--dim)', lh: 30, align: 'right' });
}
function footer(page) {
  dotAt(103, 1369, 14);
  T('Coo-Coo出海Ai实验室', 124, 1378, { cls: 'sans', size: 26, weight: 700, track: 0.02, color: 'var(--paper2)', lh: 32 });
  if (page) T(page, 984, 1378, { cls: 'mono', size: 20, weight: 400, track: 0.04, color: 'var(--mute)', lh: 26, align: 'right' });
}
function dotAt(cx, cy, d, glow) {
  const e = document.createElement('div'); e.className = 'dot';
  Object.assign(e.style, { left: (cx - d / 2) + 'px', top: (cy - d / 2) + 'px', width: d + 'px', height: d + 'px' });
  if (glow) e.style.boxShadow = '0 0 18px 4px rgba(91,46,255,.55), 0 0 60px 18px rgba(91,46,255,.22)';
  stage.appendChild(e);
}

// ------------------------------------------------------------------ photos inside an aperture
// img drawn so that image pixel (sx, sy) lands on (cx, cy); s = display px per image px
function photo(img, cx, cy, r, sx, sy, s, o = {}) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip();
  ctx.fillStyle = '#121110'; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.filter = o.filter || 'none';
  ctx.drawImage(img, cx - sx * s, cy - sy * s, img.width * s, img.height * s);
  ctx.filter = 'none'; ctx.globalAlpha = 1;
  // natural lens fall-off inside the field stop (18% at the rim)
  const g = ctx.createRadialGradient(cx, cy, r * 0.35, cx, cy, r);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${o.vig ?? 0.18})`);
  ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  if (o.terminator) { // planet lighting, used only while the retina is still "a planet"
    const tg = ctx.createLinearGradient(cx - r * 0.6, cy - r * 0.6, cx + r * 0.9, cy + r * 0.9);
    tg.addColorStop(0, 'rgba(0,0,0,0)'); tg.addColorStop(0.55, 'rgba(0,0,0,0)'); tg.addColorStop(1, `rgba(0,0,0,${o.terminator})`);
    ctx.fillStyle = tg; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  }
  ctx.restore();
  // field-stop edge: hairline + 0.8 px chromatic fringe
  if (!o.noEdge) {
    ctx.save(); ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,96,64,0.10)'; ctx.beginPath(); ctx.arc(cx, cy, r + 0.8, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(80,140,255,0.08)'; ctx.beginPath(); ctx.arc(cx, cy, r - 0.8, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(238,232,222,0.10)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

// ------------------------------------------------------------------ the iris (section 5.4)
function iris(cx, cy, r, Ro, rMax, phi0 = -Math.PI / 2) {
  const N = 9, close = 1 - r / rMax;
  const phi = phi0 + 1.6 * close * Math.PI / N;
  const k = 0.55 + 0.4 * (r / rMax);
  const c = Math.cos(Math.PI / N);
  const rc = r * c + (r / c - r * c) * k;
  const DELTA = 0.95, EXP = 0.8, STEPS = 48;
  const V = [...Array(N)].map((_, i) => phi + i * TAU / N);
  const P = (a, rad) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
  const curve = (i, u) => P(V[i] + DELTA * u, r + (Ro - r) * Math.pow(u, EXP));
  const KEY = -3 * Math.PI / 4;  // key light from upper left
  ctx.save();
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    ctx.beginPath();
    for (let s = 0; s <= STEPS; s++) { const [x, y] = curve(i, s / STEPS); s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    const a0 = V[i] + DELTA;
    ctx.arc(cx, cy, Ro, a0, a0 + TAU / N, false);
    for (let s = STEPS; s >= 0; s--) { const [x, y] = curve(j, s / STEPS); ctx.lineTo(x, y); }
    const am = V[i] + TAU / (2 * N);
    const [qx, qy] = P(am, rc), [vx, vy] = P(V[i], r);
    ctx.quadraticCurveTo(qx, qy, vx, vy);
    ctx.closePath();
    const mid = am + DELTA * 0.55;
    const key = 0.5 + 0.5 * Math.cos(mid - KEY);
    const [x0, y0] = curve(i, 0.45), [x1, y1] = curve(j, 0.45);
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    const b0 = 22 + 9 * key, b1 = 15 + 4 * key;
    g.addColorStop(0, `rgb(${b0 + 1},${b0},${b0 - 2})`); g.addColorStop(1, `rgb(${b1 + 1},${b1},${b1 - 2})`);
    ctx.fillStyle = g; ctx.fill();
  }
  // blade edges: soft shadow cast on the next blade, then a hairline highlight
  for (let i = 0; i < N; i++) {
    const path = new Path2D();
    for (let s = 0; s <= STEPS; s++) { const [x, y] = curve(i, s / STEPS); s ? path.lineTo(x, y) : path.moveTo(x, y); }
    ctx.save(); ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 3; ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 7;
    ctx.translate(1.2, 1.2); ctx.stroke(path); ctx.restore();
    const mid = V[i] + DELTA * 0.5, key = 0.5 + 0.5 * Math.cos(mid - KEY);
    ctx.strokeStyle = `rgba(238,232,222,${0.08 + 0.16 * key})`; ctx.lineWidth = 1.1; ctx.stroke(path);
  }
  // blade tips catch a little light at the aperture edge
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = V[i % N], [vx, vy] = P(a, r);
    if (!i) ctx.moveTo(vx, vy); else { const [qx, qy] = P(a - TAU / (2 * N), rc); ctx.quadraticCurveTo(qx, qy, vx, vy); }
  }
  ctx.strokeStyle = 'rgba(238,232,222,0.14)'; ctx.lineWidth = 1; ctx.stroke();
  // outer ring (16 px), anodised black with a conic highlight
  ctx.beginPath(); ctx.arc(cx, cy, Ro + 16, 0, TAU); ctx.arc(cx, cy, Ro, 0, TAU, true);
  const cg = ctx.createConicGradient(KEY - Math.PI / 2, cx, cy);
  cg.addColorStop(0, '#141312'); cg.addColorStop(0.25, '#211F1C'); cg.addColorStop(0.5, '#141312'); cg.addColorStop(0.75, '#0F0E0D'); cg.addColorStop(1, '#141312');
  ctx.fillStyle = cg; ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(238,232,222,0.12)'; ctx.beginPath(); ctx.arc(cx, cy, Ro + 0.5, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(238,232,222,0.06)'; ctx.beginPath(); ctx.arc(cx, cy, Ro + 15.5, 0, TAU); ctx.stroke();
  ctx.restore();
}

// ------------------------------------------------------------------ engraved barrel rings (section 5.5)
function arcText(text, cx, cy, rad, centre, font, color, extra = 0) {
  ctx.save(); ctx.font = font; ctx.fillStyle = color; ctx.textBaseline = 'middle';
  const ws = [...text].map((ch) => ctx.measureText(ch).width + extra);
  const total = ws.reduce((a, b) => a + b, 0) - extra;
  let a = centre - total / 2 / rad;
  [...text].forEach((ch, i) => {
    const w = ws[i] - extra, am = a + w / 2 / rad;
    ctx.save(); ctx.translate(cx + rad * Math.cos(am), cy + rad * Math.sin(am)); ctx.rotate(am + Math.PI / 2);
    // engraving: 1 px dark offset below, then the fill
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillText(ch, -w / 2, 1);
    ctx.fillStyle = color; ctx.fillText(ch, -w / 2, 0);
    ctx.restore();
    a += ws[i] / rad;
  });
  ctx.restore();
  return total / rad;
}
function ring(cx, cy, r0, r1, spec) {
  const KEY = -3 * Math.PI / 4, top = -Math.PI / 2;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r1, 0, TAU); ctx.arc(cx, cy, r0, 0, TAU, true);
  const g = ctx.createConicGradient(KEY - Math.PI / 2, cx, cy);
  g.addColorStop(0, '#151413'); g.addColorStop(0.25, '#23201D'); g.addColorStop(0.5, '#151413'); g.addColorStop(0.75, '#100F0E'); g.addColorStop(1, '#151413');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(238,232,222,0.14)'; ctx.beginPath(); ctx.arc(cx, cy, r0 + 0.5, Math.PI * 0.85, Math.PI * 1.85); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.beginPath(); ctx.arc(cx, cy, r1 - 0.5, 0, TAU); ctx.stroke();
  const rot = spec.rot || 0;
  // knurling (outer ring only)
  if (spec.knurl) {
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 300; i++) {
      const a = rot + i * TAU / 300; if (Math.abs(((a - top + Math.PI) % TAU + TAU) % TAU - Math.PI) < 0.30) continue;
      ctx.beginPath(); ctx.moveTo(cx + (r1 - 13) * Math.cos(a), cy + (r1 - 13) * Math.sin(a));
      ctx.lineTo(cx + (r1 - 2) * Math.cos(a), cy + (r1 - 2) * Math.sin(a)); ctx.stroke();
    }
  }
  // scale ticks along the inner edge
  if (spec.ticks) {
    const [step, major] = spec.ticks;
    for (let d = 0; d < 360; d += step) {
      const a = rot + d * Math.PI / 180;
      if (Math.abs(((a - top + Math.PI) % TAU + TAU) % TAU - Math.PI) < 0.26) continue;   // leave room for the label
      const L = d % major === 0 ? 9 : 5;
      ctx.strokeStyle = d % major === 0 ? 'rgba(207,199,186,0.55)' : 'rgba(207,199,186,0.28)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx + (r0 + 2) * Math.cos(a), cy + (r0 + 2) * Math.sin(a));
      ctx.lineTo(cx + (r0 + 2 + L) * Math.cos(a), cy + (r0 + 2 + L) * Math.sin(a)); ctx.stroke();
    }
  }
  // small engraved legends around the ring
  if (spec.legends) {
    spec.legends.filter(([deg]) => deg < -140 || deg > -25).forEach(([deg, txt]) => arcText(txt, cx, cy, (r0 + r1) / 2 + 3, rot + deg * Math.PI / 180, '400 12px "Geist Mono"', 'rgba(207,199,186,0.62)', 1.2));
  }
  // the label sits on the 12 o'clock index when the ring is locked
  const rm = (r0 + r1) / 2;
  const span = arcText(spec.cjk, cx, cy, rm, top + rot - 0.0, '700 22px "Noto Sans SC"', '#EEE8DE', 2);
  arcText(spec.latin, cx, cy, rm, top + rot + span / 2 + 14 / rm + (spec.latin.length * 9.5) / 2 / rm, '400 11px "Geist Mono"', 'rgba(207,199,186,0.75)', 2.2);
  ctx.restore();
}

// ------------------------------------------------------------------ frames
const E = { x: 540, y: 700 };   // the eyepiece centre on the 1080 x 1920 film grid
const HERO6 = { sx: 182.4, sy: 180.6 };   // coin centre inside coin_hero_w*.png (6x of the 61 px crop)

const FR = {};

FR.f01 = async () => {      // hook, t = 0.60 s, after the snap
  await load('coin_hero_w0.png');
  micro('01', '光圈', 'APERTURE', 'ƒ/4');
  photo(IMG['coin_hero_w0.png'], E.x, E.y, 122, HERO6.sx, HERO6.sy, 4.4 / 6);
  iris(E.x, E.y, 118, 368, 300);
  K('微软 CEO 纳德拉判断', 1148, { size: 34 });
  T('大模型', 96, 1296, { size: 124, lh: 140, weight: 700, track: -0.01, optical: -5 });
  T('要打价格战了', 96, 1436, { size: 124, lh: 140, weight: 700, track: -0.01, optical: -5 });
};

  K('纳德拉判断', 1176);

function focalScale(cx, cy, r, current) {
  const F = [24, 35, 50, 85, 135, 200, 300, 400, 600];
  const a0 = Math.PI * 0.80, a1 = Math.PI * 1.20;     // left side of the aperture
  const R = r + 30;
  ctx.save();
  ctx.strokeStyle = 'rgba(238,232,222,0.16)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
  F.forEach((f, i) => {
    const a = a1 - (a1 - a0) * i / (F.length - 1);
    const on = f === current;
    ctx.strokeStyle = on ? 'rgba(238,232,222,0.9)' : 'rgba(238,232,222,0.30)';
    ctx.lineWidth = on ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(cx + R * Math.cos(a), cy + R * Math.sin(a)); ctx.lineTo(cx + (R + (on ? 14 : 8)) * Math.cos(a), cy + (R + (on ? 14 : 8)) * Math.sin(a)); ctx.stroke();
    ctx.font = '400 15px "Geist Mono"'; ctx.fillStyle = on ? '#EEE8DE' : 'rgba(207,199,186,0.45)';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(String(f), cx + (R + 22) * Math.cos(a), cy + (R + 22) * Math.sin(a));
  });
  ctx.restore();
}

FR.f06 = async () => {      // mix, t = 27.4 s, plates on the way in
