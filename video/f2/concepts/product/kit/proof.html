/* ---------- S8: glass case over the hero coin (three.js plate + 2D glass) ---------- */
async function glassScene({ coinY, labels, keepDom, dist = 4150 }) {
  if (!keepDom) {
    idx('04', '零信任');
    el('k', '他说', M, 300);
    el('d2', '微软不等对齐问题解决，<br>先给模型套上零信任架构。', M, 352);
  }
  const tex = await new THREE.TextureLoader().loadAsync('img/hero6_glass.png');
  tex.colorSpace = THREE.SRGBColorSpace;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
  renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.domElement.style.mixBlendMode = 'lighten';
  B.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(24, W / H, 10, 10000);
  const tilt = 34 * Math.PI / 180, D = dist;
  // world: table plane z=0 (x right, y away from camera), coin at origin. Units = plate px.
  cam.up.set(0, 0, 1);
  cam.position.set(0, -Math.sin(tilt) * D, Math.cos(tilt) * D);
  cam.lookAt(0, 0, 0);
  cam.setViewOffset(W, H, 0, -(coinY - H / 2), W, H);      // coin lands at screen y = coinY
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(1080, 1000), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  scene.add(plane);
  renderer.render(scene, cam);
  // --- glass case, projected with the same camera
  const a = 230, h = 190, t = 6;   // half footprint, height, wall thickness (plate px)
  const P = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; B.appendChild(cv);
  const g = cv.getContext('2d');
  const b = { fl: P(-a, -a, 0), fr: P(a, -a, 0), bl: P(-a, a, 0), br: P(a, a, 0) };
  const T = { fl: P(-a, -a, h), fr: P(a, -a, h), bl: P(-a, a, h), br: P(a, a, h) };
  const Ti = { fl: P(-a + t, -a + t, h), fr: P(a - t, -a + t, h), bl: P(-a + t, a - t, h), br: P(a - t, a - t, h) };
  const poly = (pts) => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.closePath(); };
  const line = (p, q, w, c, blur = 0) => { g.save(); g.lineWidth = w; g.strokeStyle = c; g.lineCap = 'round'; if (blur) { g.shadowBlur = blur; g.shadowColor = c; } g.beginPath(); g.moveTo(...p); g.lineTo(...q); g.stroke(); g.restore(); };
  const lerp = (p, q, u) => [p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u];
  // 1. cast shadow of the case on the felt (key light from upper-left, 12 deg)
  g.save(); g.filter = 'blur(34px)';
  const shg = g.createLinearGradient(...b.fr, ...P(a + 170, -a + 70, 0));
  shg.addColorStop(0, 'rgba(0,0,0,.26)'); shg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = shg; poly([b.fr, P(a + 150, -a + 60, 0), P(a + 150, a + 60, 0), b.br]); g.fill(); g.restore();
  // 2. far edges, seen through two walls: faint, slightly green
  [[b.bl, b.br], [b.bl, T.bl], [b.br, T.br], [b.fl, b.bl], [b.fr, b.br]].forEach(([p, q]) => line(p, q, 1, 'rgba(200,228,214,.15)'));
  // 3. front wall: Fresnel (more reflective toward the top where the view grazes), one soft horizontal reflection band
  let gr = g.createLinearGradient(...lerp(b.fl, b.fr, .5), ...lerp(T.fl, T.fr, .5));
  gr.addColorStop(0, 'rgba(214,232,224,.025)'); gr.addColorStop(.78, 'rgba(214,232,224,.05)'); gr.addColorStop(.9, 'rgba(255,244,230,.10)'); gr.addColorStop(1, 'rgba(214,232,224,.04)');
  g.fillStyle = gr; poly([b.fl, b.fr, T.fr, T.fl]); g.fill();
  // 4. top glass: broad reflection of the soft box (back-left) + narrow sweep streak + two dust specks
  g.save(); poly([T.fl, T.fr, T.br, T.bl]); g.clip();
  const rc = P(-a * 0.55, a * 0.45, h);
  let rg = g.createRadialGradient(rc[0], rc[1], 0, rc[0], rc[1], 330);
  rg.addColorStop(0, 'rgba(255,240,222,.13)'); rg.addColorStop(.55, 'rgba(255,240,222,.05)'); rg.addColorStop(1, 'rgba(255,240,222,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  const c0 = P(-a * 0.05, -a * 0.1, h);
  const sg = g.createLinearGradient(c0[0] - 120, c0[1] + 70, c0[0] + 120, c0[1] - 70);
  sg.addColorStop(0, 'rgba(255,236,214,0)'); sg.addColorStop(.40, 'rgba(255,236,214,.05)'); sg.addColorStop(.5, 'rgba(255,244,230,.17)');
  sg.addColorStop(.60, 'rgba(255,236,214,.05)'); sg.addColorStop(1, 'rgba(255,236,214,0)');
  g.fillStyle = sg; g.fillRect(0, 0, W, H);
  [[c0[0] - 18, c0[1] + 4, .85], [c0[0] + 36, c0[1] - 15, .55]].forEach(([x, y, o]) => { g.fillStyle = `rgba(255,246,232,${o})`; g.fillRect(x, y, 1.3, 1.3); });
  g.restore();
  // 5. caustic: light refracted through the left wall lands just inside the right wall
  line(P(a - 12, -a + 40, 0.5), P(a - 12, a - 40, 0.5), 2, 'rgba(255,214,170,.18)', 7);
  // 6. contact with the felt: a dark seam + a tiny bright meniscus line above it
  line(b.fl, b.fr, 2.4, 'rgba(0,0,0,.7)');
  line(lerp(b.fl, T.fl, .012), lerp(b.fr, T.fr, .012), 1, 'rgba(232,244,238,.30)');
  // 7. edges: every visible edge is two lines (outer surface + inner surface = wall thickness), inner one float-glass green
  const dbl = (p, q, o, pi, qi) => { line(p, q, 1.3, `rgba(250,248,240,${o})`); line(pi, qi, 1, `rgba(170,214,192,${o * 0.55})`); };
  dbl(b.fl, T.fl, .50, P(-a + t, -a + t, 0), Ti.fl);
  dbl(b.fr, T.fr, .38, P(a - t, -a + t, 0), Ti.fr);
  [[T.fr, T.br, .40, Ti.fr, Ti.br], [T.br, T.bl, .26, Ti.br, Ti.bl], [T.bl, T.fl, .52, Ti.bl, Ti.fl]].forEach(([p, q, o, pi, qi]) => dbl(p, q, o, pi, qi));
  dbl(T.fl, T.fr, .70, Ti.fl, Ti.fr);
  // the key light catches the front-top edge: a short hot segment with bloom (this is what travels during the sweep)
  line(lerp(T.fl, T.fr, .02), lerp(T.fl, T.fr, .34), 2, 'rgba(255,244,228,.95)', 12);
  // 8. case label: like the label plate in front of a museum case, below a hairline
  if (labels) {
    const rows = [['身份', '每个 agent 都有自己的身份'], ['记录', '每一次工具与模型调用都留下记录'], ['权限', '规则放在模型之外']];
    const y0 = 1270;
    const rule = document.createElement('div'); rule.className = 'hl';
    Object.assign(rule.style, { left: M + 'px', top: (y0 - 22) + 'px', width: '888px' }); B.appendChild(rule);
    rows.forEach(([hd, tx], i) => el('lab', `<b>${hd}</b><span>${tx}</span>`, M, y0 + i * 72));
  }
  gauge('侧光', 12, 150, 3200);
}

const run = frames[F];
const p = run && run();
await (p || Promise.resolve());
await document.fonts.ready;
await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
window.__ready = true;
</script>
