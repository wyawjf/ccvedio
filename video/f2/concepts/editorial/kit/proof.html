// strike-through every rendered line of a block (ink hairline through the glyph centre)
function strike(node, cls, pigtail) {
  const r = document.createRange(); r.selectNodeContents(node);
  const rects = [...r.getClientRects()].filter(q => q.width > 4);
  const lines = {}; rects.forEach(q => { const k = Math.round(q.top); lines[k] = lines[k] ? { l: Math.min(lines[k].l, q.left), r: Math.max(lines[k].r, q.right), t: q.top, h: q.height } : { l: q.left, r: q.right, t: q.top, h: q.height }; });
  const fs = parseFloat(getComputedStyle(node).fontSize);
  Object.values(lines).forEach((L, i, arr) => {
    const y = L.t + L.h / 2 + fs * 0.02;
    hl(L.l - 4, y, L.r - L.l + 8, cls, 2.5);
    if (pigtail && i === arr.length - 1) {     // proofreader's delete mark: stroke ends in a small loop
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('width', 90); s.setAttribute('height', 70); s.style.cssText = `position:absolute;left:${L.r + 4}px;top:${y - 35}px;overflow:visible`;
