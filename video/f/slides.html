<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="/node_modules/@fontsource/anton/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/800.css">
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<style>
  /* tokens from DESIGN.md (taken from the v2 film) */
  :root { --violet: #5B2EFF; --hi: #6A3BFF; --lilac: #A98DFF; --paper: #F6F3EE; --paper2: #F2EEE7; --ink: #15121b; }
  html, body { margin: 0; background: transparent; }
  .s { position: relative; width: 1080px; overflow: hidden; color: var(--ink); font-family: 'Noto Sans SC', sans-serif;
       -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .p { color: var(--hi); }
  .num { font-family: 'Anton', 'Noto Sans SC', sans-serif; font-weight: 400; }
  .abs { position: absolute; }

  /* scene background: lavender-grey stage with violet glow, halftone in the edges, grain, vignette */
  .bg { position: absolute; inset: 0;
        background: radial-gradient(60% 34% at 74% 62%, rgba(106,59,255,.20), rgba(106,59,255,0) 70%),
                    radial-gradient(120% 80% at 46% 36%, #F5F2F8 0%, #E7E2EF 46%, #CDC6DA 100%); }
  .tone { position: absolute; inset: 0; background-image: radial-gradient(rgba(21,18,27,.30) 1.7px, transparent 2.1px); background-size: 13px 13px;
          -webkit-mask-image: radial-gradient(75% 65% at 50% 45%, transparent 58%, rgba(0,0,0,.85) 100%); }
  .rays { position: absolute; inset: -20%; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(21,18,27,.13) 0 .55deg, transparent .55deg 3.6deg);
          -webkit-mask-image: radial-gradient(closest-side at 50% 50%, transparent 52%, #000 100%); }
  .grain { position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .1  0 0 0 .22 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
  .vig { position: absolute; inset: 0; box-shadow: inset 0 0 260px rgba(21,18,27,.30); }
  .paperbg { position: absolute; inset: 0; background: var(--paper2); }

  /* title block */
  .bar { width: 96px; height: 12px; background: var(--violet); }
  .kick { font-weight: 900; line-height: 1.1; white-space: nowrap; }
  .kick .num { color: var(--violet); }
  .kicker { font: 800 22px/1 'Inter', sans-serif; letter-spacing: .26em; color: var(--violet); white-space: nowrap; }
  .big { font-weight: 900; line-height: 1.04; letter-spacing: -0.005em; text-shadow: 0 0 30px rgba(246,243,238,.95); white-space: nowrap; }

  /* comic caption box + panels */
  .cap { box-sizing: border-box; background: var(--paper); border: 5px solid var(--ink); padding: 22px 32px 26px; font-weight: 900; line-height: 1.34; text-wrap: balance; }
  .cap .num { font-size: 1.12em; }
  .cap .p { white-space: nowrap; }
  .panel { box-sizing: border-box; background: var(--paper); border: 5px solid var(--ink); padding: 26px 26px 24px; box-shadow: 14px 14px 0 var(--violet); }
  .ptitle { font-size: 32px; font-weight: 900; margin: 0 0 16px 4px; }
  .ptitle span { font: 800 20px/1 'Inter', sans-serif; letter-spacing: .2em; color: var(--violet); margin-left: 12px; vertical-align: 4px; }
  .chip { box-sizing: border-box; border: 4px solid var(--ink); background: var(--paper); font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .brand { font-weight: 900; letter-spacing: .04em; white-space: nowrap; }
  .brand i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--violet); margin-right: 12px; vertical-align: middle; }
  .page { font: 800 22px/1 'Inter', sans-serif; letter-spacing: .14em; color: rgba(21,18,27,.55); }

  /* taped photo panel holding the source clip */
  .ph { position: absolute; border: 6px solid var(--ink); background: var(--ink); box-shadow: 16px 16px 0 var(--violet); }
  .tape { position: absolute; width: 170px; height: 44px; background: rgba(246,243,238,.82); border: 1px solid rgba(21,18,27,.14); transform: rotate(-4deg); }
  .tag { position: absolute; background: var(--ink); color: var(--paper); font: 700 26px/1.25 'Noto Sans SC', sans-serif; padding: 10px 16px; white-space: nowrap; letter-spacing: .04em; }
  .tag b { color: var(--lilac); font-weight: 900; }
  .draft { display: inline-block; margin-top: 12px; font-size: 22px; font-weight: 700; color: #fff; background: #d33; padding: 5px 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { drawFigureCanvas, PROPS, poses } from '/src/lib/figure.js';

const P = new URLSearchParams(location.search);
const H = Number(P.get('h') || 1440);              // 1440 = 3:4 image post, 1920 = 9:16 video
const MODE = P.get('mode') || 'slide';              // slide | bump | frame | frametop | sub
const tall = H >= 1920;
// layout grid per format (video numbers follow DESIGN.md: bar 204 / kicker 234 / big 336 / captions 1180, 1430)
const G = tall
  ? { bar: 204, kick: 234, kickSize: 64, big: 336, bigSize: 128, panel: 660, caps: 1150, capSize: 52, capGap: 46, foot: 96 }
  : { bar: 100, kick: 128, kickSize: 56, big: 212, bigSize: 110, panel: 488, caps: 902, capSize: 42, capGap: 32, foot: 58 };

const root = document.getElementById('root');
const el = document.createElement('div');
el.className = 's';
el.style.height = H + 'px';
root.appendChild(el);
const add = (html) => { el.insertAdjacentHTML('beforeend', html); return el.lastElementChild; };
const stage = (rays = false) => add(`<div class="bg"></div><div class="tone"></div>${rays ? '<div class="rays"></div>' : ''}<div class="grain"></div><div class="vig"></div>`);
const cap = (html, { x = 72, y, w = 936, size = G.capSize, rot = -1.2, shadow = 'var(--ink)' }) =>
  add(`<div class="cap abs" style="left:${x}px;top:${y}px;width:${w}px;font-size:${size}px;transform:rotate(${rot}deg);box-shadow:14px 14px 0 ${shadow}">${html}</div>`);
const titleBlock = (sl, kickerText) => {
  add(`<div class="bar abs" style="left:76px;top:${G.bar}px"></div>`);
  add(`<div class="kick abs" style="left:72px;top:${G.kick}px;font-size:${G.kickSize}px">${kickerText}</div>`);
  add(`<div class="big abs" style="left:72px;top:${G.big}px;font-size:${G.bigSize}px">${sl.big.join('<br>')}</div>`);
};
const foot = (data, i, n) => {
  add(`<div class="brand abs" style="left:76px;bottom:${G.foot}px;font-size:${tall ? 34 : 28}px"><i></i>${data.brand}</div>`);
  if (i != null) add(`<div class="page abs" style="right:80px;bottom:${G.foot + 6}px">${String(i + 1).padStart(2, '0')} / ${String(n).padStart(2, '0')}</div>`);
};
function figure(pose, { x, y, h, flip = false, seed = 7 }) {
  const f = drawFigureCanvas([{ P: PROPS.adult, pose }], { pxPerUnit: 48, seed });
  const c = f.canvas, k = h / c.height;
  c.style.cssText = `position:absolute;left:${x - f.anchor[0] * k}px;top:${y - f.anchor[1] * k}px;width:${c.width * k}px;height:${h}px;${flip ? 'transform:scaleX(-1);' : ''}`;
  add(`<div class="abs" style="left:${x - h * 0.22}px;top:${y - 10}px;width:${h * 0.44}px;height:20px;border-radius:50%;background:radial-gradient(closest-side,rgba(21,18,27,.35),rgba(21,18,27,0))"></div>`);
  el.appendChild(c);
}

/* ---------- schematic panels (illustrations of the claim, no invented data) ---------- */
function panel(kind, y) {
  const w = 936, x = 72;
  if (kind === 'tiers') return add(`<div class="panel abs" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(-1deg)">
    <div class="ptitle">示意：模型市场的两层<span>SCHEMATIC</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="chip" style="width:300px;height:84px;background:var(--violet);color:#fff;border-color:var(--ink);font-size:32px;flex-direction:column;line-height:1.15">前沿模型<span style="font-size:22px;font-weight:700;opacity:.85">少数高端细分市场</span></div>
      <div class="chip" style="width:840px;height:${tall ? 150 : 120}px;font-size:40px;flex-direction:column;line-height:1.2;
           background:repeating-linear-gradient(135deg,var(--paper) 0 14px,#E9E4F2 14px 17px)"><div>日常算力 = <span class="p">大宗商品</span></div><span style="font-size:24px;font-weight:700;color:rgba(21,18,27,.7)">绝大多数企业场景 · 价格战发生在这里</span></div>
    </div></div>`);
  if (kind === 'router') {
    const ys = tall ? [40, 118, 196, 274] : [10, 76, 142, 208], cx = 250, cy = tall ? 157 : 128;
    const lines = ys.map((yy) => `<line x1="${cx}" y1="${cy}" x2="560" y2="${yy + 34}" stroke="#15121b" stroke-width="4"/><circle cx="560" cy="${yy + 34}" r="9" fill="#5B2EFF"/>`).join('');
    const labels = ['闭源 · 贵', '闭源 · 便宜', '开源 A', '开源 B'];
    return add(`<div class="panel abs" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(1deg)">
      <div class="ptitle">示意：一个产品，多个模型<span>ROUTING</span></div>
      <div style="position:relative;height:${tall ? 330 : 270}px">
        <svg width="880" height="${tall ? 330 : 270}" style="position:absolute;left:0;top:0">${lines}</svg>
        <div class="chip" style="position:absolute;left:20px;top:${cy - 62}px;width:230px;height:124px;background:var(--ink);color:#fff;font-size:40px;flex-direction:column;line-height:1.15">Copilot<span style="font-size:22px;font-weight:700;color:var(--lilac)">按任务挑模型</span></div>
        ${ys.map((yy, i) => `<div class="chip" style="position:absolute;left:575px;top:${yy}px;width:300px;height:${tall ? 68 : 58}px;font-size:${tall ? 30 : 28}px;${i === 1 || i >= 2 ? 'box-shadow:6px 6px 0 #5B2EFF;' : ''}">${labels[i]}</div>`).join('')}
      </div></div>`);
  }
  if (kind === 'exam') {
    const rows = [['退款话术合不合规', '✓'], ['报价算得对不对', '✓'], ['语气像不像你的品牌', '✗'], ['敏感问题有没有拒答', '✓']].slice(0, tall ? 4 : 3);
    return add(`<div class="panel abs" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(-1deg)">
      <div class="ptitle">示意：你自己的考题<span>PRIVATE EVAL</span></div>
      ${rows.map(([q, m], i) => `<div style="display:flex;align-items:center;gap:22px;padding:${tall ? 16 : 11}px 8px;border-top:3px solid var(--ink);font-size:${tall ? 36 : 32}px;font-weight:900">
        <span class="num" style="color:var(--violet);font-size:1.2em;width:56px">Q${i + 1}</span><span style="flex:1">${q}</span>
        <span style="font-size:1.25em;color:${m === '✓' ? 'var(--violet)' : 'var(--ink)'}">${m}</span></div>`).join('')}
      </div>`);
  }
  if (kind === 'shell') {
    const ih = tall ? 300 : 236, bh = ih - 40, cy = 20 + bh / 2;
    return add(`<div class="panel abs" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(1deg)">
      <div class="ptitle">示意：零信任外壳 · 控制都放在模型<span style="font:inherit;letter-spacing:0;margin:0;vertical-align:0;color:var(--hi)">外面</span></div>
      <div style="position:relative;height:${ih}px">
        <div style="position:absolute;left:70px;top:20px;width:740px;height:${bh}px;border:5px dashed var(--ink);border-radius:26px;background:rgba(106,59,255,.06)"></div>
        <div class="chip" style="position:absolute;left:330px;top:${cy - 52}px;width:220px;height:104px;background:var(--violet);color:#fff;font-size:42px">模型</div>
        <div class="tag" style="left:30px;top:0px;font-size:28px">身份</div>
        <div class="tag" style="left:770px;top:${cy - 26}px;font-size:28px">日志</div>
        <div class="tag" style="left:30px;top:${bh - 10}px;font-size:28px">权限</div>
      </div></div>`);
  }
}

/* ---------- token tags for the cover ---------- */
function tokenTags(y) {
  const sizes = [[300, 170], [220, 128], [160, 94], [110, 66]];
  let x = 72;
  const parts = sizes.map(([w, h], i) => {
    const html = `<div class="chip abs" style="left:${x}px;top:${y + 170 - h}px;width:${w}px;height:${h}px;font:400 ${h * 0.34}px/1 'Anton',sans-serif;letter-spacing:.06em;
      transform:rotate(${i % 2 ? 2 : -2}deg);box-shadow:${10 - i * 2}px ${10 - i * 2}px 0 ${i === 0 ? 'var(--violet)' : 'var(--ink)'};opacity:${1 - i * 0.12}">TOKEN</div>`;
    x += w + 26;
    return html;
  }).join('');
  add(parts);
  add(`<div class="num abs" style="left:${x + 4}px;top:${y - 40}px;font-size:220px;line-height:1;color:var(--violet)">↓</div>`);
}

const data = await (await fetch('/f/slides.json')).json();
const n = data.slides.length;
await document.fonts.load('900 40px "Noto Sans SC"');

if (MODE === 'sub') {
  // subtitle = caption box on a transparent strip
  const zh = P.get('zh') || '', en = P.get('en') || '', draft = P.get('draft') === '1';
  el.style.background = 'transparent';
  add(`<div class="abs" style="left:0;top:20px;width:1080px;display:flex;justify-content:center">
    <div class="cap" style="max-width:940px;font-size:52px;text-align:center;transform:rotate(-1deg);box-shadow:14px 14px 0 var(--ink)">${zh.split('|').map((l) => `<div style="white-space:nowrap">${l}</div>`).join('')}
    ${en ? `<div style="margin-top:10px;font:600 26px/1.4 'Inter',sans-serif;color:rgba(21,18,27,.62)">${en}</div>` : ''}
    ${draft ? '<div><span class="draft">字幕草稿 · 待按原话校对</span></div>' : ''}</div></div>`);
} else if (MODE === 'frame' || MODE === 'frametop') {
  // source clip mounted as a taped photo panel; the clip itself is composited by build.py at HOLE
  const sl = data.slides[Number(P.get('i'))];
  const HX = 48, HY = 600, HW = 984, HH = 554;
  if (MODE === 'frame') {
    stage();
    add(`<div class="bar abs" style="left:76px;top:150px"></div>`);
    add(`<div class="kick abs" style="left:72px;top:180px;font-size:52px"><span class="num">${sl.no}</span>&nbsp; ${sl.label}</div>`);
    add(`<div class="big abs" style="left:72px;top:262px;font-size:100px">${sl.big.join('<br>')}</div>`);
    add(`<div class="ph" style="left:${HX - 6}px;top:${HY - 6}px;width:${HW}px;height:${HH}px"></div>`);
    foot(data, null);
  } else {
    el.style.background = 'transparent';
    add(`<div class="tape" style="left:${HX + HW / 2 - 85}px;top:${HY - 26}px"></div>`);
    add(`<div class="tag" style="left:${HX - 6}px;top:${HY + HH + 6}px">${data.speaker}</div>`);
  }
} else if (MODE === 'bump') {
  const sl = data.slides[Number(P.get('i'))];
  stage(true);
  add(`<div class="bar abs" style="left:76px;top:640px"></div>`);
  add(`<div class="num abs" style="left:66px;top:670px;font-size:300px;line-height:1;color:var(--violet)">${sl.no}</div>`);
  add(`<div class="big abs" style="left:72px;top:1000px;font-size:118px">${sl.big.join('<br>')}</div>`);
  foot(data, null);
} else {
  const i = Number(P.get('i'));
  const sl = data.slides[i];
  if (sl.type === 'cover') {
    stage(true);
    add(`<div class="bar abs" style="left:76px;top:${G.bar}px"></div>`);
    add(`<div class="kicker abs" style="left:76px;top:${G.bar + 34}px">${data.kicker}</div>`);
    add(`<div class="big abs" style="left:72px;top:${G.bar + 84}px;font-size:${tall ? 156 : 150}px">${sl.big.join('<br>')}</div>`);
    tokenTags(tall ? 900 : 700);
    figure(poses.lookUp(), { x: tall ? 900 : 930, y: tall ? 1450 : 1150, h: tall ? 420 : 300, seed: 11 });
    cap(sl.cap, { y: tall ? 1520 : 1118, w: tall ? 936 : 780, size: tall ? 50 : 40, rot: -1.2, shadow: 'var(--violet)' });
    foot(data, null);
  } else if (sl.type === 'point') {
    stage();
    titleBlock(sl, `<span class="num">${sl.no}</span>&nbsp; ${sl.label}`);
    panel(sl.panel, G.panel);
    const c1 = cap(sl.cap1, { y: G.caps, rot: -1.2 });
    const y2 = G.caps + c1.offsetHeight + G.capGap;
    cap(sl.cap2, { y: y2, rot: 1.2, shadow: 'var(--violet)' });
    foot(data, i, n);
  } else if (sl.type === 'list') {
    stage();
    titleBlock(sl, sl.label);
    let y = tall ? 700 : 500;
    sl.items.forEach((t, k) => {
      const b = cap(`<span class="num" style="color:var(--violet);font-size:1.6em;margin-right:22px;vertical-align:-4px">${k + 1}</span>${t}`,
        { y, x: 72, w: tall ? 936 : 820, size: tall ? 50 : 44, rot: k % 2 ? 1.2 : -1.2, shadow: k === 2 ? 'var(--violet)' : 'var(--ink)' });
      y += b.offsetHeight + (tall ? 56 : 40);
    });
    add(`<div class="abs" style="left:76px;top:${y + 4}px;font-size:${tall ? 28 : 24}px;font-weight:500;color:rgba(21,18,27,.6)">${sl.note}</div>`);
    figure(poses.armRaised(), { x: tall ? 930 : 960, y: tall ? 1700 : 1330, h: tall ? 380 : 270, seed: 23 });
    foot(data, i, n);
  } else if (sl.type === 'end') {
    add('<div class="paperbg"></div>');
    const top = tall ? 560 : 300;
    add(`<div class="bar abs" style="left:76px;top:${top}px"></div>`);
    add(`<div class="big abs" style="left:72px;top:${top + 40}px;font-size:${tall ? 132 : 118}px;line-height:1.08;text-shadow:none">${sl.big.join('<br>')}</div>`);
    add(`<div class="abs" style="left:76px;top:${top + (tall ? 350 : 330)}px;font-size:46px;font-weight:700;color:rgba(21,18,27,.7)">${sl.sub}</div>`);
    add(`<div class="brand abs" style="left:76px;top:${top + (tall ? 520 : 460)}px;font-size:40px"><i style="width:16px;height:16px;margin-right:14px"></i>${data.brand}</div>`);
    add(`<div class="abs" style="left:76px;width:930px;bottom:${tall ? 300 : 120}px;font-size:24px;line-height:1.55;font-weight:500;color:rgba(21,18,27,.55)">${sl.src}</div>`);
    add(`<div class="page abs" style="right:80px;bottom:${G.foot + 6}px">${String(i + 1).padStart(2, '0')} / ${String(n).padStart(2, '0')}</div>`);
  }
}
window.__ready = true;
</script>
</body>
</html>
