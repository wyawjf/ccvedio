<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/800.css">
<style>
  html, body { margin: 0; }
  .c { position: relative; width: 1080px; height: 1440px; overflow: hidden; background: #ECE8E1; font-family: 'Noto Sans SC', sans-serif; }
  .bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url(/build/cover-bg.png) center / cover; transform: translateY(-300px); }
  .fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(246,243,238,.97) 0%, rgba(246,243,238,.9) 26%, rgba(246,243,238,0) 46%); }
  .t { position: absolute; left: 72px; top: 96px; }
  .bar { width: 96px; height: 12px; background: #5B2EFF; margin-bottom: 30px; }
  h1 { margin: 0; font-size: 136px; line-height: 1.08; font-weight: 900; color: #15121b; letter-spacing: -0.01em; }
  h1 span { color: #5B2EFF; }
  .sub { margin-top: 26px; font-size: 44px; font-weight: 700; color: rgba(21,18,27,.72); }
  .tag { position: absolute; left: 72px; bottom: 64px; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: .24em; color: #fff;
         background: #15121b; padding: 14px 22px; }
</style>
</head>
<body>
<div class="c">
  <div class="bg"></div><div class="fade"></div>
  <div class="t">
    <div class="bar"></div>
    <h1>当<span>智慧</span><br>像电一样便宜</h1>
    <div class="sub">AI 将帮人类推倒的五堵墙</div>
  </div>
  <div class="tag">COO-COO · AI LAB</div>
</div>
</body>
</html>
